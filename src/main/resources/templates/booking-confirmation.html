
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmation | Bus Broker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 12px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #071426, #183653);
            color: white;
        }

        .container {
            max-width: 650px;
            margin: 35px auto;
            padding: 30px;
            background: #10223a;
            border: 1px solid #d8b451;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .success {
            text-align: center;
            font-size: 55px;
        }

        h1 {
            color: #e4bd58;
            text-align: center;
        }

        .message {
            text-align: center;
            line-height: 1.7;
            color: #dddddd;
        }

        .details {
            margin-top: 25px;
            padding: 20px;
            background: #19334f;
            border-radius: 10px;
            line-height: 2;
            overflow-wrap: anywhere;
        }

        .details strong {
            color: #e4bd58;
        }

        .home-btn {
            display: block;
            margin-top: 25px;
            padding: 14px;
            border-radius: 8px;
            background: #d8b451;
            color: #071426;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }

        .home-btn:hover {
            background: #f0d47d;
        }

        .note {
            margin-top: 20px;
            text-align: center;
            color: #c9c9c9;
            font-size: 13px;
        }
    </style>
</head>

<body>
<div class="container">

    <div class="success">✓</div>

    <h1>Booking Confirmed!</h1>

    <p class="message">
        Thank you for booking with Bus Broker.
        Your demo booking confirmation is displayed below.
    </p>

    <div class="details">
        <div>
            <strong>Passenger Name:</strong>
            <span th:text="${passengerName}"></span>
        </div>

        <div>
            <strong>Age:</strong>
            <span th:text="${age}"></span>
        </div>

        <div>
            <strong>Phone:</strong>
            <span th:text="${phone}"></span>
        </div>

        <div>
            <strong>Bus:</strong>
            <span th:text="${busName}"></span>
        </div>

        <div>
            <strong>From:</strong>
            <span th:text="${source}"></span>
        </div>

        <div>
            <strong>To:</strong>
            <span th:text="${destination}"></span>
        </div>

        <div>
            <strong>Journey Date:</strong>
            <span th:text="${journeyDate}"></span>
        </div>

        <div>
            <strong>Selected Seats:</strong>
            <span th:text="${seats}"></span>
        </div>

        <div>
            <strong>Total Amount:</strong>
            ₹<span th:text="${total}"></span>
        </div>
    </div>

    <a class="home-btn" th:href="@{/}">
        Back to Home
    </a>

    <p class="note">
        This is a demo confirmation. No payment or permanent booking has been recorded.
    </p>

</div>
</body>
</html>
